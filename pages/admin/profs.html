<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajout de Professeurs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h2>Ajouter un Professeur</h2>
    <form id="prof-form">
      <input type="text" class="form-control mb-2" id="prof-nom" placeholder="Nom du professeur">
      <button type="submit" class="btn btn-primary">Ajouter</button>
    </form>
  </div>

  <script>
    document.getElementById("prof-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const nom = document.getElementById("prof-nom").value;
      fetch("../../php/add-prof.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: nom=${nom}
      })
      .then(res => res.text())
      .then(msg => alert(msg));
    });
  </script>
</body>
</html>
