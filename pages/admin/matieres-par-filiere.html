<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Matières par Filière</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h2>Associer Matière à une Filière</h2>
    <form id="assoc-form">
      <select class="form-select mb-2" id="filiere-select">
        <option>Informatique</option>
        <option>Gestion</option>
      </select>
      <select class="form-select mb-2" id="matiere-select">
        <option>Mathématiques</option>
        <option>Programmation</option>
      </select>
      <button type="submit" class="btn btn-success">Associer</button>
    </form>
  </div>

  <script>
    document.getElementById("assoc-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const filiere = document.getElementById("filiere-select").value;
      const matiere = document.getElementById("matiere-select").value;
      fetch("../../php/associer-matiere.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: filiere=${filiere}&matiere=${matiere}
      })
      .then(res => res.text())
      .then(msg => alert(msg));
    });
  </script>
</body>
</html>
