<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Projets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h2>Projets</h2>
    <form id="projet-form" class="mb-3">
      <input type="text" class="form-control mb-2" id="projet-titre" placeholder="Titre du projet">
      <textarea class="form-control mb-2" id="projet-desc" placeholder="Description"></textarea>
      <button type="submit" class="btn btn-primary">Ajouter</button>
    </form>
  </div>

  <script>
    document.getElementById("projet-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const titre = document.getElementById("projet-titre").value;
      const desc = document.getElementById("projet-desc").value;
      fetch("../../php/add-projet.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: titre=${titre}&description=${desc}
      })
      .then(res => res.text())
      .then(msg => alert(msg));
    });
  </script>
</body>
</html>
