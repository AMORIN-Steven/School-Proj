<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion des Filières</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h2>Filières</h2>
    <form id="filiere-form" class="mb-3">
      <input type="text" class="form-control mb-2" id="filiere-nom" placeholder="Nom de la filière">
      <button type="submit" class="btn btn-primary">Ajouter</button>
    </form>
    <ul class="list-group" id="filiere-list"></ul>
  </div>

  <script>
    document.getElementById("filiere-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const nom = document.getElementById("filiere-nom").value;
      fetch("../../php/add-filiere.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: nom=${nom}
      })
      .then(res => res.text())
      .then(msg => alert(msg));
    });

    fetch("../../php/get-filieres.php")
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("filiere-list");
        data.forEach(filiere => {
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.textContent = filiere;
          list.appendChild(li);
        });
      });
  </script>
</body>
</html>
