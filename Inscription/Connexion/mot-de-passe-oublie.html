<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-primary min-vh-100 d-flex align-items-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card bg-beige border-0 rounded-4 shadow-lg">
                    <div class="card-body p-5">

                        <h2 class="text-center text-primary fw-bold mb-5">
                            <i class="bi bi-key-fill"></i> Changez le mot de passe
                        </h2>

                        <form id="formulaire" class="needs-validation" novalidate>

                            <div class="text-center mb-4">
                                <label class="form-label fw-semibold text-dark fs-5">
                                    Veuillez entrer un nouveau mot de passe
                                </label>
                            </div>

                            <div class="mb-4">
                            <input type="password" id="nouveau_mdp" name="nouveau_mdp" class="form-control form-control-lg rounded-pill text-center" placeholder="" required>
                            </div>

                            <button type="submit" id="confirmer" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm text-white">
                                Confirmer
                            </button>

                            <div class="text-center mt-4">
                                <a href="Connexion.html" class="text-primary text-decoration-underline fw-medium">
                                    Retour à la connexion
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="asset/js/jquery.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="asset/custom_js/mot-de-passe-oublie.js"></script>
</body>
</html>
