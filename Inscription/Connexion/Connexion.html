<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
</head>
<body class="bg-primary min-vh-100 d-flex align-items-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card bg-beige border-0 rounded-4 shadow-lg">
                    <div class="card-body p-5">

                        <h1 class="text-center text-primary fw-bold mb-4">
                            <i class="bi bi-box-arrow-in-right"></i> Connexion
                        </h1>

                        <form id="formulaire" class="needs-validation" novalidate>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email :</label>
                                <input type="email" id="email" name="email" class="form-control form-control-lg rounded-pill" placeholder="Votre adresse email" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Mot de passe :</label>
                                <input type="password" id="password" name="mot_de_passe" class="form-control form-control-lg rounded-pill" placeholder="Veuillez entrer votre mot de passe" required>
                            </div>

                            <a href="dashboard.html" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm mb-3 text-white text-decoration-none d-block text-center">
                                Se connecter
                            </a>

                            <div class="d-flex justify-content-center gap-5 flex-wrap">
                                <a href="../Inscription.html" class="text-primary text-decoration-underline fw-medium">
                                    Pas de compte ?
                                </a>
                                <a href="mot-de-passe-oublie.html" class="text-primary text-decoration-underline fw-medium">
                                    Mot de passe oublié ?
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="JS/jquery-3.7.1.min.js.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/Connexion.js"></script>
</body>
</html>
