<!DOCTYPE html> 
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Matières</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .card-hover {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
        }
        .badge-custom {
            font-size: 0.8rem;
        }
        .btn-action {
            padding: 0.375rem 0.75rem;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <!-- En-tête -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h2 mb-1 text-primary">
                            <i class="bi bi-journals me-2"></i>Gestion des Matières
                        </h1>
                        <p class="text-muted mb-0">Gérez vos matières et leurs filières associées</p>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-0 py-3">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-list-ul me-2 text-primary"></i>
                            Liste des matières
                            <span class="badge bg-primary rounded-pill ms-2" id="matiereCount">0</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="matiereList" class="row g-3">
                        </div>
                        
                        <div class="text-center mt-4">
                            <button class="btn btn-primary btn-lg" onclick="openModal('ajouter', null)">
                                <i class="bi bi-plus-circle me-2"></i>Ajouter une matière
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="matiereModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">
                        <i class="bi bi-plus-circle me-2"></i>Ajouter une matière
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="matiereForm">
                        <input type="hidden" id="matiereId" value="">
                        
                        <div class="mb-3">
                            <label for="matiereNom" class="form-label fw-semibold">Matière</label>
                            <input type="text" class="form-control" id="matiereNom" placeholder="Nom de la matière" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Filières</label>
                            <div class="row g-2">
                                <div class="col-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="filiereSIL" value="SIL">
                                        <label class="form-check-label" for="filiereSIL">
                                            SIL
                                        </label>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="filiereSSRI" value="SSRI">
                                        <label class="form-check-label" for="filiereSSRI">
                                            SSRI
                                        </label>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="filiereRIT" value="RIT">
                                        <label class="form-check-label" for="filiereRIT">
                                            RIT
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle me-2"></i>Annuler
                    </button>
                    <button type="button" class="btn btn-primary" onclick="validateForm()">
                        <i class="bi bi-check-circle me-2"></i>VALIDER
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/custom_js/crud_matiere.js"></script>
</body>
</html>
