<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Étudiants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-hover tbody tr:hover {
            background-color: rgba(13, 110, 253, 0.1);
        }
        .note-excellente { color: #198754; font-weight: bold; }
        .note-bonne { color: #ffc107; font-weight: bold; }
        .note-moyenne { color: #0dcaf0; font-weight: bold; }
        .note-faible { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="text-center text-primary mb-3">📋 Liste des Étudiants</h1>
                <p class="text-center text-muted">Consultez les étudiants par filière et matière</p>
            </div>
        </div>

        <!-- Formulaire de sélection -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">Filtres de recherche</h5>
            </div>
            <div class="card-body">
                <form id="selectionForm" class="row g-3">
                    <div class="col-md-6">
                        <label for="filiere" class="form-label fw-bold">Filière</label>
                        <select id="filiere" class="form-select" required>
                            <option value="">-- Chargement des filières --</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="matiere" class="form-label fw-bold">Matière</label>
                        <select id="matiere" class="form-select" required disabled>
                            <option value="">-- Choisissez d'abord une filière --</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                            Afficher la liste
                        </button>
                        <div class="spinner-border spinner-border-sm text-primary ms-2 d-none" id="loadingSpinner"></div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Résultats -->
        <div id="resultSection" class="d-none">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="card-title mb-0" id="resultTitle">Résultats</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>Matricule</th>
                                    <th>Nom</th>
                                    <th>Prénom</th>
                                    <th>Email</th>
                                    <th>Note CC</th>
                                    <th>Note Exam</th>
                                    <th>Moyenne</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody">
                            </tbody>
                        </table>
                    </div>
                    <div id="noDataMessage" class="alert alert-warning text-center d-none">
                        Aucun étudiant trouvé pour cette filière et matière.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Notre script -->
    <script src="list.js"></script>
</body>
</html>
